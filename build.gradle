plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

loom {
    runs {
        configureEach {
            runDir = "../../../run/"
        }
    }
}

repositories {
    maven { url = "https://maven.parchmentmc.org" }

    %flatmod:maven%
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Dependencies
    %flatmod:dependencies%
}

configurations {
    modIndirect {
        extendsFrom configurations.modImplementation
    }
}

tasks.register("flatmodClasspath") {
    dependsOn "configureLaunch"
    doLast {
        def allFiles = configurations.compileClasspath.files.toSet()
        def mcLibFiles = configurations.minecraftLibraries.files.toSet()
        def directFiles = configurations.modImplementation.files.toSet() -
                configurations.modIndirect.files.toSet()
        def indirectFiles = configurations.modIndirect.files.toSet()

        def mcJar = (allFiles - mcLibFiles - directFiles - indirectFiles)
                .find { it.name.startsWith("minecraft-") }

        def result = [
                minecraft         : mcJar?.absolutePath ?: "",
                minecraftLibraries: mcLibFiles*.absolutePath,
                direct            : directFiles*.absolutePath,
                indirect          : indirectFiles*.absolutePath
        ]
        new File("fmod-classpath.json").text = groovy.json.JsonOutput.toJson(result)
    }
}

processResources {
    def resourceProperties = project.properties.findAll { key, value ->
        value instanceof String ||
                value instanceof Number ||
                value instanceof Boolean
    }

    inputs.properties resourceProperties

    filesMatching("fabric.mod.json") {
        expand resourceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}

tasks.named("jar") {
    destinationDirectory = file("../../../dist/")
    archiveFileName = "${project.findProperty('jarName') ?: project.name}.jar"
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}